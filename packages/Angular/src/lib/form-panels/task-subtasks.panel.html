<mj-collapsible-panel
    data-mj-tour-anchor="tasks.subtasks.panel"
    SectionKey="subtasks"
    SectionName="Sub-tasks"
    Icon="fa-solid fa-sitemap"
    [Form]="FormComponent"
    [FormContext]="FormContext"
    [DefaultExpanded]="true">
    @if (!Record.IsSaved) {
        <p class="mjt-empty">Save this task to break down and schedule sub-tasks.</p>
    } @else {
        <div class="mjt-subtask-toolbar">
            <mj-view-toggle
                [Options]="ViewOptions"
                [ActiveKey]="View"
                (KeyChange)="OnViewToggleChange($event)">
            </mj-view-toggle>
        </div>

        <div style="margin-bottom: 12px;">
            <mjt-quick-capture
                [Compact]="true"
                [Busy]="AddingChild"
                Placeholder="Break down into a sub-task (e.g. 'Draft spec by fri !high')"
                (Submitted)="OnQuickAddChild($event)">
            </mjt-quick-capture>
        </div>

        @if (View === 'list' && Record.ID) {
            <bizapps-task-list
                #subList
                [ProjectRootTaskID]="Record.ID"
                [HideToolbar]="true"
                [Compact]="true"
                (AfterTaskSelected)="OpenChild($event.ID)"
                (TaskDoubleClicked)="OpenChild($event.ID)">
            </bizapps-task-list>
        } @else if (View === 'gantt') {
            <div class="mjt-subtask-fill" #subtaskFill [style.height]="ComputedHeight">
                <bizapps-task-gantt
                    #subGantt
                    [ParentTaskID]="Record.ID"
                    [IncludeParentSummary]="true"
                    [Height]="ComputedHeight"
                    (TaskDoubleClicked)="OpenChild($event)">
                </bizapps-task-gantt>
            </div>
        } @else if (View === 'kanban' && Record.ID) {
            <div class="mjt-subtask-fill" #subtaskFill [style.height]="ComputedHeight">
                <bizapps-task-kanban
                    #subKanban
                    [ParentTaskID]="Record.ID"
                    (TaskDoubleClicked)="OpenChild($event)">
                </bizapps-task-kanban>
            </div>
        } @else if (View === 'hierarchy') {
            <div class="mjt-subtask-fill" #subtaskFill [style.height]="ComputedHeight">
                <mj-hierarchy-tree
                    [Config]="treeConfig"
                    [ZoomLevel]="persistedZoomLevel"
                    (ZoomChange)="onZoomChange($event)"
                    (Navigate)="onNavigate($event)">
                </mj-hierarchy-tree>
            </div>
        }
    }
</mj-collapsible-panel>
