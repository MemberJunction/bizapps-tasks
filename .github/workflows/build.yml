name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
      # pnpm-workspace.yaml + package.json affect resolution (overrides,
      # onlyBuiltDependencies, deps).
      - 'pnpm-workspace.yaml'
      - 'package.json'
      # Every package tsconfig extends a root tsconfig, and turbo.json defines the
      # build graph and its hashing: both change build output.
      - 'tsconfig.*.json'
      - 'turbo.json'
      # So a change to this workflow runs it.
      - '.github/workflows/build.yml'
  pull_request:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.*.json'
      - 'turbo.json'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages
